<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6fa">
  <title>Door signs · UCC Spaces</title>
  <meta name="description" content="Printable signs with each room's QR code and door code, for check-in.">
  <link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin-spaces.css">
  <link rel="stylesheet" href="/css/door-signs.css"><link rel="stylesheet" href="/css/brand.css">
  <script type="module" src="/js/door-signs.js"></script>
</head>
<body class="is-app is-board is-portal is-signs">
  <header class="topbar signs-top">
    <a class="brand" href="/admin"><img class="crest crest--img" src="/media/ucc-crest.webp" alt="University of Cape Coast crest" width="33" height="38"><span class="brand__text">UCC Spaces<small>UNIVERSITY OF CAPE COAST</small></span></a>
    <span class="portal-tag">Timetable office</span>
    <nav class="topbar__nav" aria-label="Door signs">
      <a class="topbar__link" href="/admin#/rooms">← Rooms</a>
      <button class="button button--primary" type="button" data-print>Print</button>
    </nav>
  </header>

  <main class="signs-page">
    <div class="signs-intro">
      <h1 class="serif page__title" data-signs-title>Door signs</h1>
      <p class="muted" data-signs-note>Print one per room and put it by the door at eye level. Scanning the QR code opens the room's
        door page: people check in to their booking there, see whether the room is free, and book it.</p>
      <p class="alert" data-error hidden></p>
    </div>
    <div class="signs" data-signs></div>
  </main>
</body>
</html>
