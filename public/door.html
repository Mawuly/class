<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6fa">
  <title>Room door · UniGuide</title>
  <meta name="description" content="Check in to your booking, see whether this room is free, and book it.">
  <link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/fraunces-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin-spaces.css">
  <link rel="stylesheet" href="/css/brand.css">
  <link rel="stylesheet" href="/css/door-light.css">
  <script type="module" src="/js/door.js"></script>
</head>
<body class="is-app is-door is-door-light">
  <div class="stage" aria-hidden="true"><div class="stage__fallback"></div></div>

  <header class="topbar door-top">
    <a class="brand" href="/"><img class="crest crest--img" src="/media/ucc-crest.webp" alt="University of Cape Coast crest" width="33" height="38"><span class="brand__text"><span class="wordmark" aria-label="UniGuide"><span class="wm__l" aria-hidden="true">U</span><span class="wm__l" aria-hidden="true">n</span><span class="wm__l wm__l--pin" aria-hidden="true">ı</span><span class="wm__l" aria-hidden="true">G</span><span class="wm__l" aria-hidden="true">u</span><span class="wm__l" aria-hidden="true">i</span><span class="wm__l" aria-hidden="true">d</span><span class="wm__l" aria-hidden="true">e</span></span><small>UNIVERSITY OF CAPE COAST</small></span></a>
    <span class="clock mono" data-clock></span>
  </header>

  <main class="door" data-door aria-live="polite">
    <p class="muted door__loading">Loading this room…</p>
  </main>

  <!-- Shared sheet (check-in by typed code) -->
  <dialog class="sheet" data-edit-sheet aria-labelledby="edit-title">
    <div class="sheet__panel glass">
      <header class="sheet__head">
        <h2 class="panel__title" id="edit-title" data-edit-title>Edit</h2>
        <button class="link-button sheet__close" type="button" data-edit-close>Close</button>
      </header>
      <div data-edit-body></div>
    </div>
  </dialog>
</body>
</html>
